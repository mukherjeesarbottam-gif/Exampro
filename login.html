<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Exam Pro</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/3d-backgrounds.css">
    <link rel="stylesheet" href="css/login.css">
    <script src="js/theme.js"></script>

</head>


<body class="login-page">

    <!-- 3D Background -->
    <div id="three-bg" aria-hidden="true"></div>

    <!-- Floating 3D Elements (CSS-based, around the card) -->
    <div class="floating-elements" aria-hidden="true">
        <div class="float-object float-cap">
            <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <div class="float-object float-sphere sphere-1"></div>
        <div class="float-object float-sphere sphere-2"></div>
        <div class="float-object float-cube cube-1"></div>
        <div class="float-object float-cube cube-2"></div>
        <div class="float-object float-ring ring-1"></div>
        <div class="float-object float-ring ring-2"></div>
        <div class="float-object float-particle particle-1"></div>
        <div class="float-object float-particle particle-2"></div>
        <div class="float-object float-particle particle-3"></div>
        <div class="float-object float-particle particle-4"></div>
        <div class="float-object float-particle particle-5"></div>
    </div>

    <!-- ── Premium 3D Navigation ─────────────────────────── -->
    <nav class="navbar auth-navbar login-navbar">
        <div class="logo">
            <i class="fa-solid fa-graduation-cap"></i>
            <span class="logo-text">Exam <span class="logo-pro">Pro</span></span>
        </div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="index.html#about">About</a>
            <a href="login.html" class="active">Login</a>
            <a href="register.html">Registration</a>
        </div>
        <div class="nav-actions">
            <button class="theme-toggle" aria-label="Toggle theme" style="margin-right: 12px;">
                <i class="theme-toggle-icon fa-solid fa-moon"></i>
            </button>
            <a href="index.html" class="btn btn-3d btn-back-home">
                <i class="fa-solid fa-arrow-left"></i> <span>Back to Home</span>
            </a>
        </div>
    </nav>

    <!-- ── Login Card ────────────────────────────────────── -->
    <div class="login-container three-content">

        <div class="login-card auth-panel-3d">

            <!-- Glass reflection sheen -->
            <div class="card-sheen"></div>

            <!-- CARD HEADER -->
            <div class="login-card-header">

                <div class="login-icon">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>

                <h2 class="login-title">
                    Exam <span class="login-title-pro">Pro</span>
                </h2>

                <h3 class="login-welcome">Welcome Back!</h3>

                <p class="login-subtitle">
                    Sign in to continue your learning journey.
                </p>

            </div>


            <!-- LOGIN FORM -->
            <form id="loginForm">

                <!-- EMAIL -->
                <div class="form-group">
                    <label
                        class="form-label"
                        for="email"
                    >
                        Email
                    </label>

                    <div class="input-wrapper">
                        <i class="fa-solid fa-envelope input-icon"></i>
                        <input
                            type="email"
                            id="email"
                            class="form-control login-input"
                            placeholder="Enter your email"
                            required
                        >
                    </div>
                </div>


                <!-- PASSWORD -->
                <div class="form-group">
                    <label
                        class="form-label"
                        for="password"
                    >
                        Password
                    </label>

                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input
                            type="password"
                            id="password"
                            class="form-control login-input"
                            placeholder="Enter your password"
                            required
                        >
                        <i
                            class="fa-regular fa-eye toggle-password"
                            id="togglePassword"
                        ></i>
                    </div>
                </div>


                <!-- OPTIONS -->
                <div class="auth-options login-options">

                    <label class="remember-label">

                        <input
                            type="checkbox"
                            id="remember"
                            class="neon-checkbox"
                        >

                        <span class="checkbox-custom">
                            <i class="fa-solid fa-check"></i>
                        </span>

                        Remember me

                    </label>


                    <a href="#" class="forgot-link">
                        Forgot Password?
                    </a>

                </div>


                <!-- LOGIN BUTTON -->
                <button
                    type="submit"
                    class="btn btn-3d login-submit-btn"
                    id="loginBtn"
                >
                    <i class="fa-solid fa-right-to-bracket"></i>
                    Login
                </button>

            </form>


            <!-- DIVIDER -->
            <div class="divider login-divider">
                OR
            </div>


            <!-- GOOGLE LOGIN -->
            <button
                type="button"
                class="btn btn-3d google-login-btn"
                id="googleLoginBtn"
            >

                <svg class="google-icon" viewBox="0 0 48 48" width="20" height="20" aria-hidden="true">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>

                Sign in with Google

            </button>


            <!-- REGISTER -->
            <div class="auth-footer login-footer">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </div>

        </div>

    </div>


    <!-- Three.js Import Map -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
      }
    }
    </script>


    <!-- Global utilities -->
    <script src="js/main.js"></script>

    <!-- 3D Background + UI Effects + Card Parallax -->
    <script type="module">
        import initBackground from "./js/3d/init-background.js";
        import { initUiEffects } from "./js/3d/ui-effects.js";
        import { initCardParallax } from "./js/3d/card-parallax.js";
        initBackground();
        initUiEffects();
        initCardParallax();
    </script>


    <!-- Login + Firebase -->
    <script
        type="module"
        src="js/login.js?v=2"
    ></script>

</body>

</html>
