<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Exam - ExamPro</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/admin.css">
  <script src="../js/theme.js"></script>
</head>
<body>

  <div class="dashboard-layout">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <aside class="sidebar sidebar-admin" id="sidebar">
      <div class="sidebar-header">
        <a href="dashboard.html" class="sidebar-logo">
          <i class="fa-solid fa-user-shield"></i> AdminPro
        </a>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-border-all"></i> Dashboard</a>
        <a href="exams.html" class="nav-item active"><i class="fa-solid fa-file-signature"></i> Exams</a>
        <a href="questions.html" class="nav-item"><i class="fa-solid fa-list-check"></i> Questions</a>
        <a href="students.html" class="nav-item"><i class="fa-solid fa-users"></i> Students</a>
        <a href="results.html" class="nav-item"><i class="fa-solid fa-award"></i> Results</a>
        <a href="analytics.html" class="nav-item"><i class="fa-solid fa-chart-line"></i> Analytics</a>
      </nav>
      <div class="sidebar-footer">
        <a href="#" class="nav-item" id="logoutBtn"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <a href="exams.html" class="btn btn-ghost" style="padding: 4px 8px;"><i class="fa-solid fa-arrow-left"></i></a>
          <div class="page-title" style="margin:0; font-size: 1.25rem;">Create New Examination</div>
        </div>
        <div class="topbar-right">
          <button class="theme-toggle" aria-label="Toggle theme">
            <i class="theme-toggle-icon fa-solid fa-moon"></i>
          </button>
        </div>
      </header>

      <div class="dashboard-body">
        
        <form id="createExamForm" style="max-width: 900px;">
          
          <div class="card mb-lg">
            <div class="card-header">
              <h3>Basic Information</h3>
            </div>
            <div class="card-body">
              <div class="form-group">
                <label class="form-label">Exam Title</label>
                <input type="text" id="examTitle" class="form-control" placeholder="Enter exam title" required>
              </div>
              <div class="flex gap-md mb-md">
                <div class="form-group" style="flex: 1; margin: 0;">
                  <label class="form-label">Subject</label>
                  <input type="text" id="examSubject" class="form-control" placeholder="e.g. Mathematics" required>
                </div>
                <div class="form-group" style="flex: 1; margin: 0;">
                  <label class="form-label">Difficulty</label>
                  <select id="examDifficulty" class="form-control" required>
                    <option value="Easy">Easy</option>
                    <option value="Medium" selected>Medium</option>
                    <option value="Hard">Hard</option>
                  </select>
                </div>
              </div>
              <div class="form-group">
                <label class="form-label">Description</label>
                <textarea id="examDescription" class="form-control" rows="3" placeholder="Brief description of the exam"></textarea>
              </div>
            </div>
          </div>

          <div class="card mb-lg">
            <div class="card-header">
              <h3>Examination Settings</h3>
            </div>
            <div class="card-body">
              <div class="flex gap-md mb-md">
                <div class="form-group" style="flex: 1; margin: 0;">
                  <label class="form-label">Duration (Minutes)</label>
                  <input type="number" id="examDuration" class="form-control" min="1" required>
                </div>
                <div class="form-group" style="flex: 1; margin: 0;">
                  <label class="form-label">Total Questions</label>
                  <input type="number" id="examTotalQuestions" class="form-control" min="1" required>
                </div>
              </div>
              <div class="flex gap-md mb-md">
                <div class="form-group" style="flex: 1; margin: 0;">
                  <label class="form-label">Total Marks</label>
                  <input type="number" id="examTotalMarks" class="form-control" min="1" required>
                </div>
                <div class="form-group" style="flex: 1; margin: 0;">
                  <label class="form-label">Passing Marks</label>
                  <input type="number" id="examPassingMarks" class="form-control" min="1" required>
                </div>
              </div>
              <div class="form-group">
                <label class="form-label">Total Points</label>
                <input type="number" id="examTotalPoints" class="form-control" min="0" placeholder="Total points awarded for this exam">
              </div>
            </div>
          </div>

          <div class="card mb-lg">
            <div class="card-header">
              <h3>Schedule & Status</h3>
            </div>
            <div class="card-body">
              <div class="flex gap-md mb-md">
                <div class="form-group" style="flex: 1; margin: 0;">
                  <label class="form-label">Scheduled Start</label>
                  <input type="datetime-local" id="examScheduledStart" class="form-control">
                </div>
                <div class="form-group" style="flex: 1; margin: 0;">
                  <label class="form-label">Scheduled End</label>
                  <input type="datetime-local" id="examScheduledEnd" class="form-control">
                </div>
              </div>
              <div class="flex gap-md mb-md">
                <div class="form-group" style="flex: 1; margin: 0;">
                  <label class="form-label">Status</label>
                  <select id="examStatus" class="form-control">
                    <option value="Draft">Draft</option>
                    <option value="Scheduled">Scheduled</option>
                    <option value="Active">Active</option>
                  </select>
                </div>
                <div class="form-group" style="flex: 1; margin: 0; display: flex; align-items: flex-end; padding-bottom: 8px;">
                  <label style="display: flex; align-items: center; gap: 8px; font-weight: 500; cursor: pointer;">
                    <input type="checkbox" id="examPublished" style="width: 18px; height: 18px;">
                    Publish immediately (visible to students)
                  </label>
                </div>
              </div>
            </div>
          </div>

          <div class="flex gap-md justify-end mb-2xl">
            <a href="exams.html" class="btn btn-outline">Cancel</a>
            <button type="submit" id="createExamBtn" class="btn btn-primary">Publish Examination</button>
          </div>

        </form>

      </div>
    </main>
  </div>

  <script src="../js/main.js"></script>
  <script type="module">
    import "../js/services/authService.js";
    import "../js/services/examService.js";

    document.addEventListener('DOMContentLoaded', async () => {
      await window.ExamPro.AuthService.requireAuth('admin');

      const createExamBtn = document.getElementById('createExamBtn');
      const form = document.getElementById('createExamForm');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const scheduledStart = document.getElementById('examScheduledStart').value;
        const scheduledEnd   = document.getElementById('examScheduledEnd').value;

        // Validate schedule window
        if (scheduledStart && scheduledEnd && new Date(scheduledEnd) <= new Date(scheduledStart)) {
          window.ExamPro.Utils.showToast('Scheduled end must be after scheduled start.', 'error');
          return;
        }

        const examData = {
          title: document.getElementById('examTitle').value.trim(),
          subject: document.getElementById('examSubject').value.trim(),
          difficulty: document.getElementById('examDifficulty').value,
          description: document.getElementById('examDescription').value.trim(),
          duration: parseInt(document.getElementById('examDuration').value),
          totalQuestions: parseInt(document.getElementById('examTotalQuestions').value),
          totalMarks: parseInt(document.getElementById('examTotalMarks').value),
          passingMarks: parseInt(document.getElementById('examPassingMarks').value),
          totalPoints: parseInt(document.getElementById('examTotalPoints').value) || 0,
          scheduledStart: scheduledStart ? new Date(scheduledStart).toISOString() : null,
          scheduledEnd: scheduledEnd ? new Date(scheduledEnd).toISOString() : null,
          status: document.getElementById('examStatus').value,
          published: document.getElementById('examPublished').checked
        };

        // Validate passing marks doesn't exceed total marks
        if(examData.passingMarks > examData.totalMarks) {
          window.ExamPro.Utils.showToast('Passing marks cannot exceed total marks.', 'error');
          return;
        }

        createExamBtn.disabled = true;
        createExamBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Creating...';

        try {
          await window.ExamPro.ExamService.createExam(examData);
          window.ExamPro.Utils.showToast('Examination created successfully!', 'success');
          setTimeout(() => {
            window.location.href = 'exams.html';
          }, 1000);
        } catch (error) {
          console.error("Error creating exam:", error);
          window.ExamPro.Utils.showToast('Failed to create examination.', 'error');
          createExamBtn.disabled = false;
          createExamBtn.innerHTML = 'Publish Examination';
        }
      });
    });
  </script>
</body>
</html>
