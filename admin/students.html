<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Students - ExamPro</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/admin.css">
  <script src="../js/theme.js"></script>
</head>
<body>

  <div class="dashboard-layout">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <aside class="sidebar sidebar-admin" id="sidebar">
      <div class="sidebar-header">
        <a href="dashboard.html" class="sidebar-logo">
          <i class="fa-solid fa-user-shield"></i> AdminPro
        </a>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-border-all"></i> Dashboard</a>
        <a href="exams.html" class="nav-item"><i class="fa-solid fa-file-signature"></i> Exams</a>
        <a href="questions.html" class="nav-item"><i class="fa-solid fa-list-check"></i> Questions</a>
        <a href="students.html" class="nav-item active"><i class="fa-solid fa-users"></i> Students</a>
        <a href="results.html" class="nav-item"><i class="fa-solid fa-award"></i> Results</a>
        <a href="analytics.html" class="nav-item"><i class="fa-solid fa-chart-line"></i> Analytics</a>
      </nav>
      <div class="sidebar-footer">
        <a href="#" class="nav-item" id="logoutBtn"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="menu-toggle" id="menuToggle"><i class="fa-solid fa-bars"></i></button>
          <div class="page-title" style="margin:0; font-size: 1.25rem;">Manage Students</div>
        </div>
        <div class="topbar-right">
          <button class="theme-toggle" aria-label="Toggle theme">
            <i class="theme-toggle-icon fa-solid fa-moon"></i>
          </button>
        </div>
      </header>

      <div class="dashboard-body">
        
        <div class="card mb-lg">
          <div class="card-body flex justify-between items-center" style="flex-wrap: wrap; gap: 16px;">
            <div class="flex gap-md">
              <div class="search-bar" style="border: 1px solid var(--border-color); width: 300px;">
                <i class="fa-solid fa-magnifying-glass text-muted"></i>
                <input type="text" id="studentSearch" placeholder="Search by name, ID or email...">
              </div>
              <select class="form-control" style="width: auto;">
                <option value="">Department</option>
                <option>Computer Science</option>
                <option>Information Technology</option>
              </select>
            </div>
            
            <button class="btn btn-outline"><i class="fa-solid fa-file-export"></i> Export CSV</button>
          </div>
        </div>

        <div class="card">
          <div class="table-container">
            <table class="table" id="studentsTable">
              <thead>
                <tr>
                  <th>Student</th>
                  <th>Student ID</th>
                  <th>Department</th>
                  <th>Semester</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                <!-- Injected via JS -->
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Student Results Modal -->
  <div class="modal-overlay" id="studentResultsModal">
    <div class="modal-content" style="max-width: 800px; padding: var(--spacing-xl);">
      <div class="flex justify-between items-center mb-md">
        <h2 id="resultsModalTitle">Student Results</h2>
        <button class="btn btn-ghost" id="closeResultsModal"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="resultsModalContent">
        <!-- Injected via JS -->
      </div>
    </div>
  </div>

  <!-- Reset Confirmation Modal -->
  <div class="modal-overlay" id="resetModal">
    <div class="modal-content" style="max-width: 480px; padding: var(--spacing-xl); text-align: center;">
      <div style="font-size: 3rem; margin-bottom: var(--spacing-md);">⚠️</div>
      <h2 class="mb-md">Are you sure?</h2>
      <p class="text-muted mb-lg" id="resetModalMsg">This action cannot be undone.</p>
      <div class="flex gap-md justify-center">
        <button class="btn btn-outline" id="cancelResetBtn">Cancel</button>
        <button class="btn btn-error" id="confirmResetBtn" style="background-color: var(--error-color); color: white; border-color: var(--error-color);">Yes, Reset</button>
      </div>
    </div>
  </div>

  <script src="../js/main.js"></script>
  <script type="module" src="../js/admin/students.js"></script>
</body>
</html>
