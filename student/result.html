<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam Result - ExamPro</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <script src="../js/theme.js"></script>
  <style>
    .result-layout {
      min-height: 100vh;
      background-color: var(--bg-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--spacing-xl);
    }
    .result-card {
      background-color: var(--card-bg);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-color);
      padding: var(--spacing-2xl);
      max-width: 600px;
      width: 100%;
      text-align: center;
    }
    .score-circle {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 10px solid var(--primary-light);
      margin: 0 auto var(--spacing-xl);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .score-circle.pass { border-color: var(--success-bg); }
    .score-circle.fail { border-color: var(--error-bg); }
    
    .score-percentage {
      font-size: 3rem;
      font-weight: 700;
      line-height: 1;
    }
    .score-circle.pass .score-percentage { color: var(--success-color); }
    .score-circle.fail .score-percentage { color: var(--error-color); }
    
    .score-text {
      font-size: 1rem;
      color: var(--text-secondary);
      margin-top: 8px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--spacing-md);
      margin-bottom: var(--spacing-xl);
      text-align: left;
    }
    .stat-box {
      background-color: var(--bg-color);
      padding: var(--spacing-md) var(--spacing-lg);
      border-radius: var(--radius-md);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>

  <div class="result-layout">
    <button class="theme-toggle" aria-label="Toggle theme" style="position: fixed; top: 20px; right: 20px; z-index: 100;">
      <i class="theme-toggle-icon fa-solid fa-moon"></i>
    </button>
    <div class="result-card">
      <div style="font-size: 3rem; margin-bottom: var(--spacing-sm);">🎉</div>
      <h1 class="mb-sm">Examination Completed</h1>
      <p class="text-muted mb-xl" id="examTitle">Loading...</p>

      <div class="score-circle" id="scoreCircle">
        <div class="score-percentage" id="scorePercentage">--%</div>
        <div class="score-text" id="scoreFraction">-- / --</div>
      </div>

      <h3 class="mb-lg" id="statusText">Status: --</h3>

      <div class="stats-grid">
        <div class="stat-box">
          <span class="text-muted">Total Marks</span>
          <strong id="statTotalMarks">--</strong>
        </div>
        <div class="stat-box">
          <span class="text-muted">Your Score</span>
          <strong id="statScore">--</strong>
        </div>
        <div class="stat-box">
          <span class="text-muted">Points Earned</span>
          <strong id="statPoints">--</strong>
        </div>
        <div class="stat-box">
          <span class="text-muted">Date</span>
          <strong id="statDate">--</strong>
        </div>
      </div>

      <div class="flex gap-md justify-center">
        <a href="dashboard.html" class="btn btn-outline">Back to Dashboard</a>
        <a href="#" id="detailedResultBtn" class="btn btn-primary">View Detailed Result</a>
      </div>
    </div>
  </div>

  <script src="../js/main.js"></script>
  <script type="module">
    import "../js/services/authService.js";
    import "../js/services/resultService.js";
    import "../js/services/examService.js";

    document.addEventListener('DOMContentLoaded', async () => {
      const user = await window.ExamPro.AuthService.requireAuth('student');
      if (!user) return;

      const urlParams = new URLSearchParams(window.location.search);
      const resultId = urlParams.get('id');

      if(!resultId) {
        window.location.href = 'dashboard.html';
        return;
      }

      // Fetch the attempt directly by ID
      const result = await window.ExamPro.ResultService.getAttemptById(resultId);

      if(!result) {
        alert("Result not found");
        window.location.href = 'dashboard.html';
        return;
      }

      // Security: ensure the student can only view their own attempt
      if (result.studentId !== user.uid) {
        alert("Access denied");
        window.location.href = 'dashboard.html';
        return;
      }

      const exam = await window.ExamPro.ExamService.getExamById(result.examId);

      document.getElementById('examTitle').innerText = result.examTitle || 'Examination';
      document.getElementById('scorePercentage').innerText = `${(result.percentage ?? 0).toFixed(1)}%`;
      document.getElementById('scoreFraction').innerText = `${result.score ?? 0} / ${result.totalMarks ?? 0}`;
      
      const circle = document.getElementById('scoreCircle');
      const statusText = document.getElementById('statusText');
      if(result.status === 'Pass') {
        circle.classList.add('pass');
        statusText.innerText = 'Status: PASSED';
        statusText.style.color = 'var(--success-color)';
      } else {
        circle.classList.add('fail');
        statusText.innerText = 'Status: FAILED';
        statusText.style.color = 'var(--error-color)';
      }

      document.getElementById('statTotalMarks').innerText = result.totalMarks ?? '--';
      document.getElementById('statScore').innerText = result.score ?? '--';
      document.getElementById('statPoints').innerText = result.pointsEarned ?? 0;
      
      const dateStr = result.submittedAt || result.date || '';
      document.getElementById('statDate').innerText = dateStr ? window.ExamPro.Utils.formatDate(dateStr) : '--';

      document.getElementById('detailedResultBtn').href = `detailed-result.html?id=${result.id}`;
    });
  </script>
</body>
</html>
